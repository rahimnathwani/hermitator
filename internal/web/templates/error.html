{{define "content"}}
{{if .V}}
<section class="card empty">
  <div class="tile">{{icon "alert"}}</div>
  <h2>{{.Title}}</h2>
  <p>{{.Data}}</p>
  <a class="button" href="/">{{icon "back"}}Back to hermitator</a>
</section>
{{else}}
<div class="auth">
  <div class="auth-box">
    <section class="card empty">
      <div class="tile">{{icon "alert"}}</div>
      <h2>{{.Title}}</h2>
      <p>{{.Data}}</p>
      <a class="button" href="/">{{icon "back"}}Back to hermitator</a>
    </section>
  </div>
</div>
{{end}}
{{end}}
