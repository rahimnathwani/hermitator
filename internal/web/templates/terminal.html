{{define "content"}}
{{$d := .Data}}{{$a := $d.Agent}}
{{template "agent-head" $d}}
<p class="muted small">A login shell inside the sandbox. The agent stays awake while this is open. Processes you start here end when the terminal closes or the agent sleeps.</p>
<link rel="stylesheet" href="/static/vendor/xterm.css?v={{.Version}}">
<div class="terminal section" data-mount="terminal" data-src="/agents/{{$a.ID}}/terminal/ws"
     data-xterm="/static/vendor/xterm.js?v={{.Version}}" data-fit="/static/vendor/addon-fit.js?v={{.Version}}"></div>
{{end}}
